<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Alerta de Seguridad Android</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #080808;
      color: white;
      font-family: Arial, sans-serif;
    }

    .alerta {
      width: 90%;
      max-width: 500px;
      background: #181818;
      border: 2px solid #ff3030;
      border-radius: 18px;
      padding: 30px;
      text-align: center;
      box-shadow: 0 0 40px rgba(255, 0, 0, 0.35);
    }

    .icono {
      font-size: 65px;
    }

    h1 {
      color: #ff3030;
      font-size: 28px;
    }

    p {
      color: #ddd;
      font-size: 17px;
      line-height: 1.5;
    }

    .barra {
      width: 100%;
      height: 10px;
      background: #333;
      border-radius: 10px;
      overflow: hidden;
      margin-top: 25px;
    }

    .progreso {
      width: 0%;
      height: 100%;
      background: #ff3030;
      animation: cargar 5s linear forwards;
    }

    @keyframes cargar {
      to {
        width: 100%;
      }
    }

    #rickroll {
      display: none;
      width: 90%;
      max-width: 700px;
      text-align: center;
    }

    #rickroll h1 {
      color: #ff3030;
    }

    iframe {
      width: 100%;
      aspect-ratio: 16 / 9;
      border: 0;
      border-radius: 15px;
    }
  </style>
</head>

<body>

  <!-- ALERTA FALSA -->
  <div class="alerta" id="alerta">
    <div class="icono">⚠️</div>

    <h1>¡ALERTA DE SEGURIDAD!</h1>

    <p>
      Se ha detectado una actividad sospechosa
      en este dispositivo Android.
    </p>

    <p>
      Analizando el sistema...
    </p>

    <div class="barra">
      <div class="progreso"></div>
    </div>

    <p id="contador">Análisis de seguridad: 0%</p>
  </div>


  <!-- RICKROLL -->
  <div id="rickroll">

    <h1>😂 ¡TE LA CREÍSTE!</h1>

    <p>
      No había ningún virus. Era una broma 😎
    </p>

    <iframe
      src="https://www.youtube.com/embed/dQw4w9WgXcQ?autoplay=1"
      allow="autoplay; encrypted-media"
      allowfullscreen>
    </iframe>

  </div>


  <script>
    let porcentaje = 0;

    const contador = setInterval(() => {
      porcentaje += 1;

      document.getElementById("contador").textContent =
        "Análisis de seguridad: " + porcentaje + "%";

      if (porcentaje >= 100) {
        clearInterval(contador);
      }
    }, 50);


    // Después de 5 segundos aparece el Rickroll
    setTimeout(() => {

      document.getElementById("alerta").style.display = "none";
      document.getElementById("rickroll").style.display = "block";

    }, 5000);
  </script>

</body>
</html>
